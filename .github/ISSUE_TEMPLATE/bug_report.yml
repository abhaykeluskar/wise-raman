name: 🐛 Bug Report
description: Create a report to help us improve WiseRaman
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: bank-format
    attributes:
      label: Bank / Statement Format
      description: What bank or statement format were you parsing (e.g. SBI Savings, HDFC CC)?
      placeholder: e.g. HDFC Bank Savings
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us what you expected to happen.
      placeholder: Tell us what you see!
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output from backend or browser console.
      render: shell
