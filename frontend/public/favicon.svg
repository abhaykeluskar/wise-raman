<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171E19" />
      <stop offset="100%" stop-color="#0E1310" />
    </linearGradient>

    <!-- Brand Green Gradient -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7FC39A" />
      <stop offset="60%" stop-color="#5BAE78" />
      <stop offset="100%" stop-color="#3F8F5E" />
    </linearGradient>

    <!-- Warm Earth / Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5D4C1" />
      <stop offset="100%" stop-color="#A77B58" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#5BAE78" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#2A352D" stroke-width="1.5" />

  <!-- Subtle Radial Inner Highlight -->
  <circle cx="20" cy="18" r="22" fill="#5BAE78" opacity="0.08" filter="blur(8px)" />

  <!-- WiseRaman Modern Geometric Ascent Emblem -->
  <!-- Left Ascending Pillar -->
  <path d="M16 42V32C16 30.8954 16.8954 30 18 30H21C22.1046 30 23 30.8954 23 32V42C23 43.1046 22.1046 44 21 44H18C16.8954 44 16 43.1046 16 42Z" fill="url(#goldGrad)" opacity="0.85" />

  <!-- Center Dynamic Growth Pillar -->
  <path d="M26 42V25C26 23.8954 26.8954 23 28 23H31C32.1046 23 33 23.8954 33 25V42C33 43.1046 32.1046 44 31 44H28C26.8954 44 26 43.1046 26 42Z" fill="url(#greenGrad)" />

  <!-- Right Apex Pillar -->
  <path d="M36 42V18C36 16.8954 36.8954 16 38 16H41C42.1046 16 43 16.8954 43 18V42C43 43.1046 42.1046 44 41 44H38C36.8954 44 36 43.1046 36 42Z" fill="url(#greenGrad)" filter="url(#glow)" />

  <!-- Upward Vector Surge Line (Chevron / Trend Arrow) -->
  <path d="M18 35L29.5 22L39.5 15L47 22.5" stroke="url(#greenGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Apex Beacon Node -->
  <circle cx="47" cy="22.5" r="2.5" fill="#E2F1E8" stroke="#3F8F5E" stroke-width="1.5" />
</svg>
